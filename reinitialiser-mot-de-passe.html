<!DOCTYPE html>
<html lang="fr">
<head>
  <link rel="icon" href="favicon.png" type="image/png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://thxbpjumbntiqwexsqut.supabase.co https://cdn.jsdelivr.net; frame-src https://checkout.stripe.com; base-uri 'self'; form-action 'self' https://checkout.stripe.com;">
<title>Réinitialiser le mot de passe · Espace prestataire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F3EFE6;
    --paper-2:#EAE4D6;
    --ink:#1B2A4A;
    --ink-soft:#4A5670;
    --mustard:#D9A441;
    --mustard-dark:#9C731E;
    --line:#D8D0BE;
    --radius:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
  }
  .screen{
    width:100%;
    max-width:420px;
    min-height:100vh;
    padding:2rem 1.25rem 3rem;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:1.75rem;
  }
  .brand-mark{
    width:38px;height:38px;border-radius:50%;
    background:var(--ink);
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .brand-mark svg{width:18px;height:18px;stroke:var(--paper);}
  .brand-name{
    font-family:'Fraunces',serif;
    font-size:19px;
    font-weight:500;
    margin:0;
  }
  .ticket{
    background:#fff;
    border-radius:var(--radius);
    border:1px solid var(--line);
    box-shadow:0 1px 0 var(--line);
    overflow:hidden;
  }
  .ticket-head{padding:1.5rem 1.5rem 1.25rem;}
  .eyebrow{
    font-size:11px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--mustard-dark);
    font-weight:600;
    margin:0 0 6px;
  }
  h1{
    font-family:'Fraunces',serif;
    font-size:24px;
    font-weight:500;
    line-height:1.25;
    margin:0 0 .5rem;
  }
  .subtitle{
    font-size:13px;
    color:var(--ink-soft);
    line-height:1.5;
    margin:0;
  }
  .perforation{
    position:relative;
    height:0;
    border-top:1.5px dashed var(--line);
  }
  .perforation::before,.perforation::after{
    content:"";
    position:absolute;
    top:-9px;
    width:18px;height:18px;
    border-radius:50%;
    background:var(--paper);
  }
  .perforation::before{left:-9px;}
  .perforation::after{right:-9px;}
  .ticket-body{padding:1.5rem;}
  label{
    display:block;
    font-size:12px;
    font-weight:600;
    color:var(--ink-soft);
    margin:0 0 6px;
  }
  .field{margin-bottom:1.1rem;}
  input{
    width:100%;
    font-family:'Inter',sans-serif;
    font-size:16px;
    padding:11px 12px;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--paper);
    color:var(--ink);
  }
  input:focus-visible,button:focus-visible,a:focus-visible{
    outline:2px solid var(--ink);
    outline-offset:2px;
  }
  .field-error{
    font-size:11.5px;
    color:#B3441E;
    margin:6px 0 0;
    display:none;
  }
  .form-error{
    font-size:12.5px;
    color:#B3441E;
    background:#FBEAE2;
    border-radius:8px;
    padding:10px 12px;
    margin:0 0 1.1rem;
    display:none;
    line-height:1.5;
  }
  .form-success{
    font-size:12.5px;
    color:#2E5233;
    background:#E4EDE2;
    border-radius:8px;
    padding:10px 12px;
    margin:0 0 1.1rem;
    display:none;
    line-height:1.5;
  }
  .btn-primary{
    width:100%;
    font-family:'Inter',sans-serif;
    font-size:15px;
    font-weight:600;
    padding:14px;
    border-radius:10px;
    border:none;
    background:var(--ink);
    color:var(--paper);
    cursor:pointer;
  }
  .btn-primary:active{transform:scale(.98);}
  .btn-primary:disabled{opacity:.6;cursor:default;}
  .fine-print{
    text-align:center;
    font-size:12.5px;
    color:var(--ink-soft);
    margin:1.25rem 0 0;
    line-height:1.5;
  }
  .fine-print a{color:var(--ink);font-weight:600;text-decoration:none;}
</style>
<link href="apple-glass.css" rel="stylesheet">
<link href="polish.css" rel="stylesheet">
</head>
<body>

<div class="screen">

  <div class="brand">
    <div class="brand-mark">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="6" cy="6" r="3"></circle>
        <circle cx="6" cy="18" r="3"></circle>
        <line x1="20" y1="4" x2="8.12" y2="15.88"></line>
        <line x1="14.47" y1="14.48" x2="20" y2="20"></line>
        <line x1="8.12" y1="8.12" x2="12" y2="12"></line>
      </svg>
    </div>
    <div>
      <p class="brand-name">Espace prestataire</p>
    </div>
  </div>

  <div class="ticket" id="reset-panel">
    <div class="ticket-head">
      <p class="eyebrow">Nouveau mot de passe</p>
      <h1>Choisissez un mot de passe</h1>
      <p class="subtitle" id="reset-subtitle">Ce lien vous a été envoyé par e-mail. Choisissez un nouveau mot de passe pour votre compte.</p>
    </div>

    <div class="perforation"></div>

    <div class="ticket-body">
      <p class="form-error" id="form-error" role="alert"></p>
      <p class="form-success" id="form-success" role="status"></p>

      <div class="field" id="field-password1">
        <label for="new-password1">Nouveau mot de passe</label>
        <input id="new-password1" type="password" placeholder="8 caractères minimum" autocomplete="new-password">
        <p class="field-error" id="err-password1">Le mot de passe doit contenir au moins 8 caractères.</p>
      </div>

      <div class="field" id="field-password2">
        <label for="new-password2">Confirmez le mot de passe</label>
        <input id="new-password2" type="password" placeholder="8 caractères minimum" autocomplete="new-password">
        <p class="field-error" id="err-password2">Les deux mots de passe ne correspondent pas.</p>
      </div>

      <button class="btn-primary" id="btn-reset" type="button">Valider le nouveau mot de passe</button>

      <p class="fine-print"><a href="connexion-prestataire.html">Retour à la connexion</a></p>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js" integrity="sha384-GFr3yTh5lJznCbZfpTtXnwboFsxqtTQoeTZCRHhE0579KrRmlCzen5AA8ohaB5ug" crossorigin="anonymous"></script>
<script>
(async function(){
  const SUPABASE_URL = 'https://thxbpjumbntiqwexsqut.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRoeGJwanVtYm50aXF3ZXhzcXV0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ1NzgyNzksImV4cCI6MjEwMDE1NDI3OX0.tpxE9V5oksnZM16-3xuch3hMqXSJSbmQTuP7NVlj_bY';
  window.__sb = window.__sb || window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { persistSession: true, autoRefreshToken: true, storageKey: 'espace-prestataire-auth' }
  });
  const sb = window.__sb;

  const formError = document.getElementById('form-error');
  const formSuccess = document.getElementById('form-success');
  const btn = document.getElementById('btn-reset');

  function showError(msg){
    formSuccess.style.display = 'none';
    formError.textContent = msg;
    formError.style.display = 'block';
  }

  // Le lien envoyé par e-mail (resetPasswordForEmail) ouvre cette page avec
  // un jeton de récupération dans l'URL. Le SDK Supabase le détecte
  // automatiquement (detectSessionInUrl, activé par défaut) et déclenche
  // l'évènement PASSWORD_RECOVERY avec une session valide le temps de
  // choisir le nouveau mot de passe. Sans ce jeton (page ouverte
  // directement), on affiche une erreur plutôt qu'un formulaire inopérant.
  let recoveryReady = false;
  sb.auth.onAuthStateChange((event) => {
    if(event === 'PASSWORD_RECOVERY') recoveryReady = true;
  });

  const { data: { session } } = await sb.auth.getSession();
  if(session) recoveryReady = true;

  if(!recoveryReady){
    // Laisse une seconde au SDK pour traiter le fragment d'URL avant de
    // conclure que le lien est invalide ou expiré.
    await new Promise(r => setTimeout(r, 800));
  }
  const { data: { session: session2 } } = await sb.auth.getSession();
  if(!session2 && !recoveryReady){
    document.getElementById('reset-subtitle').textContent = 'Ce lien de réinitialisation est invalide ou a expiré.';
    document.getElementById('field-password1').style.display = 'none';
    document.getElementById('field-password2').style.display = 'none';
    btn.style.display = 'none';
    showError('Merci de redemander un lien de réinitialisation depuis la page de connexion.');
    return;
  }

  btn.addEventListener('click', async () => {
    const p1 = document.getElementById('new-password1');
    const p2 = document.getElementById('new-password2');
    const v1 = p1.value;
    const v2 = p2.value;

    const okLen = v1.length >= 8;
    const okMatch = v1 === v2 && v2.length > 0;

    document.getElementById('err-password1').style.display = okLen ? 'none' : 'block';
    document.getElementById('err-password2').style.display = (okLen && !okMatch) ? 'block' : 'none';
    formError.style.display = 'none';

    if(!okLen || !okMatch) return;

    btn.disabled = true;
    btn.textContent = 'Enregistrement…';

    const { error } = await sb.auth.updateUser({ password: v1 });

    if(error){
      btn.disabled = false;
      btn.textContent = 'Valider le nouveau mot de passe';
      showError('Impossible de mettre à jour le mot de passe : ' + error.message);
      return;
    }

    document.getElementById('field-password1').style.display = 'none';
    document.getElementById('field-password2').style.display = 'none';
    btn.style.display = 'none';
    formSuccess.textContent = 'Mot de passe mis à jour. Redirection vers la connexion…';
    formSuccess.style.display = 'block';
    setTimeout(() => { window.location.href = 'connexion-prestataire.html'; }, 1500);
  });

  ['new-password1','new-password2'].forEach(id => {
    document.getElementById(id).addEventListener('keydown', e => {
      if(e.key === 'Enter') btn.click();
    });
  });
})();
</script>

</body>
</html>
