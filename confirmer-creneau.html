<!DOCTYPE html>
<html lang="fr">
  <head>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://thxbpjumbntiqwexsqut.supabase.co https://cdn.jsdelivr.net; frame-src https://checkout.stripe.com; base-uri 'self'; form-action 'self' https://checkout.stripe.com;">
    <title>Confirmer un créneau · Kreno</title>
    <link href="apple-glass.css" rel="stylesheet">
    <link href="polish.css" rel="stylesheet">
    <style>
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      margin: 0;
      padding: 24px;
      background: #f6fbfc;
      color: #15242b;
      font-family: Inter,system-ui,sans-serif;
    }
    main {
      max-width: 440px;
      width: 100%;
      background: #fff;
      border: 1px solid #e2ecef;
      border-radius: 18px;
      padding: 32px;
      box-sizing: border-box;
      box-shadow: 0 20px 60px rgba(33,64,75,.10);
    }
    h1 {
      font-size: 25px;
      line-height: 1.2;
      margin: 0 0 12px;
    }
    .muted {
      color: #58707a;
      line-height: 1.55;
    }
    .notice {
      margin: 20px 0;
      padding: 13px 14px;
      border-radius: 10px;
      background: #eff9f4;
      color: #216448;
      line-height: 1.45;
    }
    .error {
      background: #fff1f0;
      color: #9e3328;
    }
    .btn-primary {
      width: 100%;
      margin-top: 12px;
    }
    .hidden {
      display: none;
    }
    .legal-note {
      font-size: 12px;
      margin: 18px 0 0;
    }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Kreno</p>
      <h1 id="title">Confirmer votre intérêt pour ce créneau</h1>
      <p class="muted"
        id="description">Vous êtes la première personne à répondre ? Confirmez votre intérêt. Le prestataire validera ensuite le rendez-vous dans son agenda.</p>
      <div class="notice hidden" id="notice"></div>
      <button class="btn-primary" id="claim"
        type="button">Je souhaite ce créneau</button>
      <p
        class="muted legal-note">Cette confirmation ne remplace pas la validation finale du rendez-vous par le prestataire.</p>
    </main>
    <script
      src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js" crossorigin="anonymous"></script>
    <script>
    (async function () {
      const url = "https://thxbpjumbntiqwexsqut.supabase.co";
      const key =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRoeGJwanVtYm50aXF3ZXhzcXV0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ1NzgyNzksImV4cCI6MjEwMDE1NDI3OX0.tpxE9V5oksnZM16-3xuch3hMqXSJSbmQTuP7NVlj_bY";
      const token = new URLSearchParams(location.search).get("token");
      const button = document.getElementById("claim"),
        notice = document.getElementById("notice"),
        title = document.getElementById("title"),
        description = document.getElementById("description");
      function show(text, error) {
        notice.textContent = text;
        notice.className = "notice" + (error ? " error" : "");
        notice.classList.remove("hidden");
      }
      if (!token || token.length < 32) {
        button.disabled = true;
        title.textContent = "Lien invalide";
        description.textContent =
          "Ce lien de confirmation est incomplet ou a été modifié.";
        return;
      }
      button.addEventListener("click", async () => {
        button.disabled = true;
        button.textContent = "Confirmation…";
        try {
          const response = await fetch(url + "/functions/v1/claim-slot-offer", {
            method: "POST",
            headers: { "Content-Type": "application/json", "apikey": key },
            body: JSON.stringify({ token }),
          });
          const data = await response.json();
          if (!response.ok) {
            throw new Error(data.error || "Impossible de confirmer.");
          }
          if (data.result === "confirmed") {
            title.textContent = "Votre réponse est enregistrée";
            description.textContent =
              "Le prestataire va maintenant confirmer le rendez-vous dans son agenda.";
            show("Vous êtes le ou la première à avoir répondu.");
            button.remove();
          } else if (data.result === "already_taken") {
            title.textContent = "Créneau déjà attribué";
            description.textContent =
              "Une autre personne a répondu avant vous. Vous restez sur la liste d’attente.";
            show(
              "Nous vous préviendrons lors d’un prochain créneau compatible.",
              true,
            );
            button.remove();
          } else if (data.result === "expired") {
            title.textContent = "Offre expirée";
            description.textContent =
              "Le délai de réponse est dépassé. Vous restez sur la liste d’attente.";
            show("Vous pourrez être prévenu·e à nouveau.", true);
            button.remove();
          } else throw new Error("Lien invalide ou déjà utilisé.");
        } catch (error) {
          show(
            error.message || "Une erreur est survenue. Réessayez plus tard.",
            true,
          );
          button.disabled = false;
          button.textContent = "Je souhaite ce créneau";
        }
      });
    })();
    </script>
  </body>
</html>
